<!DOCTYPE html>
<html lang="en" class="select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="../src/assets/index_out.css" rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"
      type="text/javascript"
    ></script>
    <title>Graph Viewer</title>
  </head>

  <body class="w-full min-h-screen flex">
    <!-- Taskbar -->
    <div
      id="task-bar"
      class="fixed top-[-50px] left-0 w-full h-[50px] bg-gray-800 text-white flex justify-around items-center transition-all duration-300 z-50"
    >
      <!-- Upload nodes from file -->
      <div>
        <input type="file" id="upload-nodes" class="hidden" />
        <button
          id="upload-nodes-button"
          class="px-4 py-2 bg-gray-700 hover:bg-gray-600"
        >
          Upload nodes
        </button>
      </div>
  
      <!-- Upload edges -->
      <div>
        <input type="file" id="upload-edges" class="hidden" />
        <button
          id="upload-edges-button"
          class="px-4 py-2 bg-gray-700 hover:bg-gray-600"
        >
          Upload edges
        </button>
      </div>
  
      <button class="px-4 py-2 bg-gray-700 hover:bg-gray-600">Empty</button>
      <button class="px-4 py-2 bg-gray-700 hover:bg-gray-600">Save</button>
    </div>
  
    <!-- First container (50% width) -->
    <div class="flex flex-col w-[40%] min-h-screen p-[1%] pr-[0.5%] gap-y-[2%]">
      <div
        class="flex bg-slate-600 h-[50%] max-h-[50%] resize-none rounded-2xl"
      >
        <div
          class="grid grid-cols-2 flex-row justify-center w-full h-[100%] p-[4%] gap-x-[4%] overflow-hidden"
        >
          <!-- Form for Graph input raw data -->
          <div
            class="flex flex-col w-full py-[3%] px-[5%] bg-gray-100 rounded-2xl mt-4"
          >
            <label
              for="graph-input-data"
              class="text-lg font-semibold mb-2 text-center"
            >
              Nodes
            </label>
            <textarea
              id="graph-input-data"
              name="graph-input-area"
              class="w-full h-full p-2 border border-gray-300 rounded-md resize-none focus:outline-none focus:ring-2 focus:ring-blue-400"
            >
  1
  2
  3
  4
  5
            </textarea>
            <button
              id="update-nodes-button"
              type="button"
              class="mt-3 px-4 py-2 bg-green-500 text-blue-500 rounded hover:bg-green-400"
            >
              Update
            </button>
          </div>
  
          <!-- Form for Graph edges -->
          <div
            class="flex flex-col w-full py-[3%] px-[5%] bg-gray-100 rounded-2xl mt-4"
          >
            <label
              for="graph-edges-data"
              class="text-lg font-semibold mb-2 text-center"
            >
              Edges
            </label>
            <textarea
              id="graph-edges-data"
              name="graph-edges-area"
              class="w-full h-full p-2 border border-gray-300 rounded-md resize-none focus:outline-none focus:ring-2 focus:ring-blue-400"
            >
  1 2
  2 3
  1 3
  4 2
  4 5
            </textarea>
            <button
              type="button"
              id="update-edges-button"
              class="mt-3 px-4 py-2 bg-green-500 text-blue-500 rounded hover:bg-green-400"
            >
              Update
            </button>
          </div>
        </div>
      </div>
  
      <!-- Second container for interactive graph options using dropdown menus -->
      <div class="flex-1 bg-slate-400 p-3 w-full h-[50%] max-h-[55%] rounded-2xl">
        <!-- Dropdown for Default Graph functionalities -->
        <div class="mb-4">
          <button
            class="w-full px-4 py-2 bg-blue-600 text-white rounded-2xl hover:bg-blue-500"
            onclick="toggleDropdown('default-graph-dropdown')"
          >
            Default Graph
          </button>
          <div id="default-graph-dropdown" class="hidden mt-2 bg-white rounded-xl shadow-md">
            <button
              id="bfs-button"
              class="block w-full px-4 py-2 text-left hover:bg-gray-100"
            >
              BFS
            </button>
            <button
              id="dfs-button"
              class="block w-full px-4 py-2 text-left hover:bg-gray-100"
            >
              DFS
            </button>
          </div>
        </div>
  
        <!-- Dropdown for Flow Graph functionalities -->
        <div class="mb-4">
          <button
            class="w-full px-4 py-2 bg-blue-600 text-white rounded-2xl hover:bg-blue-500"
            onclick="toggleDropdown('flow-graph-dropdown')"
          >
            Flow Graph
          </button>
          <div id="flow-graph-dropdown" class="hidden mt-2 bg-white rounded-xl shadow-md">
            <button
              id="max-flow-button"
              class="block w-full px-4 py-2 text-left hover:bg-gray-100"
            >
              Search maximum flow
            </button>
            <button
              id="min-path-button"
              class="block w-full px-4 py-2 text-left hover:bg-gray-100"
            >
              Search minimum path
            </button>
          </div>
        </div>
  
        <!-- Dropdown for Spanning Tree functionalities -->
        <div>
          <button
            class="w-full px-4 py-2 bg-blue-600 text-white rounded-2xl hover:bg-blue-500"
            onclick="toggleDropdown('spanning-tree-dropdown')"
          >
            Spanning Tree
          </button>
          <div id="spanning-tree-dropdown" class="hidden mt-2 bg-white rounded-xl shadow-md">
            <button
              id="spanning-tree-button"
              class="block w-full px-4 py-2 text-left hover:bg-gray-100"
            >
              Build
            </button>
          </div>
        </div>

        <div class="flex grow-1 ">
          <textarea
            id="graph-system-info"
            class="block w-full px-4 py-2 mt-2 border  border-gray-300 grow-1 rounded-2xl resize bg-gray-200 text-gray-600 cursor-not-allowed"
            readonly
            placeholder="System information will appear here..."
          ></textarea>

        </div>

      </div>
    </div>
  
    <!-- Third container with graph view -->
    <div
      id="graph-view-area"
      class="flex w-[60%] max-h-screen pl-[0.5%] p-[1%] overflow-hidden"
    >
      <div
        id="network"
        class="flex-1 bg-pink-10 p-3 h-[100%] max-h-full overflow-auto rounded-2xl"
      ></div>
    </div>
  
    <script>
      function toggleDropdown(dropdownId) {
        const dropdown = document.getElementById(dropdownId);
        dropdown.classList.toggle("hidden");
      }
    </script>
  </body>
  
    <!-- There are scripts -->
    <script src="./Reader.js"></script>
    <script src="./Parser.js"></script>
    <script src="./UIUpdater.js"></script>
    <script src="./Graph.js"></script>
    <script src="./GeneralGraph.js"></script>
    <script src="./GraphUIUpdater.js"></script>
    <script src="./GeneralGraphUpdater.js"></script>
    <script src="./Collector.js"></script>
    <script src="./FlowGraph.js"></script>
    <script src="./SpaningTree.js"></script>
    <script src="./preload.js"></script>

    <script>
      // Show task bar when mouse is near the top of the screen
      document.addEventListener("mousemove", function (event) {
        const taskBar = document.getElementById("task-bar");
        if (event.clientY < 50) {
          taskBar.style.top = "0"; // Show the bar
        } else {
          taskBar.style.top = "-50px"; // Hide the bar
        }
      });

      // Task selection logic
      function selectTask(taskNumber) {
        alert("Selected Task " + taskNumber);
      }
    </script>
  </body>
</html>
